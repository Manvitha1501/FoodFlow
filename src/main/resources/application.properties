server.port=9090

# Spring Data MongoDB Configuration
# Resolves MONGODB_URI environment variable, fallback to local MongoDB instance
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/foodflow}

# Security & JWT Configuration
# Resolves JWT_SECRET_KEY environment variable, fallback to local test key
security.jwt.secret-key=${JWT_SECRET_KEY:9a763845fc1a8f3b145d6f8e71a4f3d2e1b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8}
# Token duration: 24 hours (in milliseconds)
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:86400000}

# Logging configuration
logging.level.org.springframework.security=INFO
logging.level.com.foodflow=DEBUG

# Trust & Reliability Configuration Weights
foodflow.trust.restaurant.food-accuracy-weight=0.30
foodflow.trust.restaurant.successful-donation-weight=0.25
foodflow.trust.restaurant.cancellation-weight=0.20
foodflow.trust.restaurant.quality-weight=0.15
foodflow.trust.restaurant.response-weight=0.10

foodflow.trust.ngo.pickup-weight=0.30
foodflow.trust.ngo.completion-weight=0.25
foodflow.trust.ngo.acceptance-weight=0.20
foodflow.trust.ngo.response-weight=0.15
foodflow.trust.ngo.rating-weight=0.10

foodflow.trust.bayesian.prior-weight=5.0
foodflow.trust.bayesian.global-average=75.0
foodflow.trust.bayesian.minimum-observations=1

# Analytics & Sustainability Impact Configuration
foodflow.analytics.average-meal-weight=0.45
foodflow.analytics.co2-factor=2.5
foodflow.analytics.trees-factor=21.0
foodflow.analytics.water-factor=1000.0
foodflow.analytics.dashboard-refresh-interval=300


